<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
    <meta charset="UTF-8">
    <title>Frame Show AI - در حال آماده‌سازی</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #1e1e1e; /* تیره حرفه‌ای‌تر */
            color: #f0f0f0; 
            overflow: hidden;
            user-select: none;
            padding: 20px;
        }
        .container {
            text-align: center;
            max-width: 90%;
            animation: fadeIn 1s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .logo-text {
            font-size: 2.5em;
            font-weight: bold;
            color: #2563eb; /* آبی برند شما */
            margin-bottom: 10px;
            letter-spacing: 1px;
        }
        h2 {
            font-size: 1.1em;
            margin-bottom: 20px;
            color: #ccc;
            font-weight: normal;
        }
        .loader-wrapper {
            margin: 30px 0;
        }
        .loader {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid #2563eb;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .status-text {
            font-size: 0.9em;
            color: #888;
            margin-top: 20px;
            letter-spacing: 0.5px;
        }
        .dots:after {
            content: '.';
            animation: dots 1.5s steps(5, end) infinite;
        }
        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60% { content: '...'; }
            80%, 100% { content: ''; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-text">Frame Show AI</div>
        <h2>پیشرو در نوآوری صنعت درب و پنجره</h2>
        
        <div class="loader-wrapper">
            <div class="loader"></div>
        </div>
        
        <p class="status-text">
            در حال راه‌اندازی هسته هوش مصنوعی<span class="dots"></span>
        </p>
    </div>
</body>
</html>
